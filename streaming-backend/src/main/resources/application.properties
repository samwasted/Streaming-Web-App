spring.application.name=streaming-backend


DATASOURCE_URL=jdbc:mysql://localhost:3306/stream
DATASOURCE_USERNAME=samwasted
DATASOURCE_PASSWORD=mysqlpass
FRONTEND_URL=http://localhost:5173

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

frontend.url=${FRONTEND_URL}

# Explicitly define the dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Enable Hibernate to automatically create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=100MB

spring.servlet.multipart.max-request-size=100MB

files.video = videos/

file.video.hsl=videos_hls/

file.thumbnail.dir=thumbnails/